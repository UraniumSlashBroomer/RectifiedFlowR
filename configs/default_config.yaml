model:
  img_size: 32
  in_channels: 3
  patch_size: 4
  emb_dim: 128
  ffn_dim_ratio: 4
  n_heads: 8
  num_layers: 4
  positional_encoding: 'sincos'
  p_pos_encoding_dropout: 0.0
  p_encoder_dropout: 0.0

  ema_model:
    decay: 0.999

train:
  data:
    dataset: 'CIFAR10'
    num_training: 49000
    num_validation: 1000
    batch_size: 128
    drop_last: true
  optimizer:
    lr: 0.0003
    weight_decay: 0.00001
  process:
    epochs: 250
  scheduler:
    type: 'CosineAnnealingLR'
    eta_min: 1.0e-06
    warmup:
      type: 'linear'
      start_factor: 0.05
      epochs: 20

checkpoint:
  img_save_every_n_epochs: 10
  img_B: 10
  img_T: 10
  model_save_every_n_epochs: 5
  saveroot: results/
